name: Import Denisov Photo case assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-site-case-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    if: github.event.head_commit.message == 'Import Denisov Photo case assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Denisov Photo case assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/site-case
          curl -fL --retry 3 'https://static.tildacdn.com/tild6366-3163-4233-b331-396366363230/5.jpg' -o assets/site-case/hero.jpg
          curl -fL --retry 3 'https://static.tildacdn.com/tild3861-6635-4665-a639-313634313232/22.jpg' -o assets/site-case/editorial.jpg
          curl -fL --retry 3 'https://static.tildacdn.com/tild3337-6163-4830-b661-303063623838/19.jpg' -o assets/site-case/portrait.jpg
          curl -fL --retry 3 'https://static.tildacdn.com/tild3137-6338-4162-b735-363931303032/30.jpg' -o assets/site-case/reportage.jpg
          curl -fL --retry 3 'https://static.tildacdn.com/tild3964-6332-4262-b330-643766626433/20.jpg' -o assets/site-case/detail.jpg
          curl -fL --retry 3 'https://static.tildacdn.com/tild3031-6266-4234-a435-633534616639/11.jpg' -o assets/site-case/action.jpg
          for f in assets/site-case/*.jpg; do
            test "$(stat -c%s "$f")" -gt 20000
            test "$(xxd -p -l 2 "$f")" = 'ffd8'
          done

      - name: Commit site-case assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-case
          git commit -m 'Store Denisov Photo case assets locally'
          git push origin HEAD:main
