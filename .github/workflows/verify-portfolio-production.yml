name: Verify portfolio production
on:
  push:
    branches: [main]
    paths: ['index.html','core.css','script.js','photo-gallery.js','photo.css','product-experience.js','product-experience.css','site-experience.js','site-experience.css','server.js','package.json','.github/workflows/verify-portfolio-production.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real browser capture
        run: |
          cat > verify.cjs <<'NODE'
          const { chromium }=require('playwright');const assert=require('node:assert/strict');const fs=require('node:fs');const url='https://portfolio-main-production-fdd5.up.railway.app/';const build='20260918-final10';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function wait(){for(let i=0;i<60;i++){try{const r=await fetch(url,{cache:'no-store'}),h=await r.text();if(r.ok&&h.includes('portfolio-build" content="'+build+'"'))return}catch{}await sleep(5000)}throw Error('production timeout')}
          async function scroll(page){const h=await page.evaluate(()=>document.documentElement.scrollHeight);for(let y=0;y<h;y+=650){await page.evaluate(v=>scrollTo(0,v),y);await page.waitForTimeout(100)}await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(800)}
          (async()=>{await wait();fs.mkdirSync('browser-preview',{recursive:true});const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1440,height:1000},reducedMotion:'reduce'});await p.goto(url,{waitUntil:'networkidle',timeout:120000});await scroll(p);await p.waitForSelector('#product.product-web-demo .dai-browser');await p.waitForSelector('#site.site-client-demo .site-browser');await p.waitForSelector('#photo.photo-section',{state:'attached',timeout:30000});
            const pageErrors=[];p.on('pageerror',e=>pageErrors.push(e.message));
            await p.locator('#youtube-featured').click();await p.waitForSelector('#viewer.is-open iframe');await p.locator('#viewer-close').click();await p.waitForSelector('#viewer',{state:'hidden'});
            await p.locator('[data-event-work="promo1"]').click();await p.waitForSelector('#viewer.is-open .event-viewer-video');await p.waitForFunction(()=>{const v=document.querySelector('#viewer .event-viewer-video');return v&&v.readyState>=1&&v.videoWidth>0&&!v.error});await p.locator('#viewer-close').click();await p.waitForSelector('#viewer',{state:'hidden'});
            await p.locator('[data-event-work="promo2"]').click();await p.waitForSelector('#viewer.is-open .event-viewer-video');await p.waitForFunction(()=>{const v=document.querySelector('#viewer .event-viewer-video');return v&&v.readyState>=1&&v.videoWidth>0&&!v.error});await p.locator('#viewer-close').click();await p.waitForSelector('#viewer',{state:'hidden'});
            await p.locator('[data-ai-work="cartoon"]').click();await p.waitForSelector('#viewer.is-open #ai-cartoon-player');await p.waitForFunction(()=>{const v=document.querySelector('#viewer #ai-cartoon-player');return v&&v.readyState>=1&&v.videoWidth>0&&!v.error});await p.evaluate(async()=>{const v=document.querySelector('#viewer #ai-cartoon-player');v.muted=true;await v.play();});await p.waitForFunction(()=>document.querySelector('#viewer #ai-cartoon-player')?.currentTime>0.25);await p.locator('#viewer-close').click();await p.waitForSelector('#viewer',{state:'hidden'});
            await p.locator('[data-ai-work="ad"]').click();await p.waitForSelector('#viewer.is-open #ai-ad-player');await p.locator('#viewer-close').click();await p.waitForSelector('#viewer',{state:'hidden'});
            assert.deepEqual(pageErrors,[]);
            const s=await p.evaluate(()=>({pending:document.body.innerText.includes('МАТЕРИАЛЫ ПОЗЖЕ'),old:!!document.querySelector('.product-demo-section,.site-case-section,.dai-demo-frame,.site-case-capture'),w:innerWidth,sw:document.documentElement.scrollWidth}));assert.equal(s.pending,false);assert.equal(s.old,false);assert.ok(s.sw<=s.w+2);await p.screenshot({path:'browser-preview/portfolio-desktop.png',fullPage:true,animations:'disabled'});await p.locator('#video').scrollIntoViewIfNeeded();await p.waitForTimeout(500);await p.screenshot({path:'browser-preview/portfolio-video.png',fullPage:false,animations:'disabled'});await p.locator('#product').scrollIntoViewIfNeeded();await p.waitForTimeout(500);await p.screenshot({path:'browser-preview/portfolio-product.png',fullPage:false,animations:'disabled'});await p.locator('#site').scrollIntoViewIfNeeded();await p.waitForTimeout(500);await p.screenshot({path:'browser-preview/portfolio-site.png',fullPage:false,animations:'disabled'});const m=await b.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});await m.goto(url,{waitUntil:'networkidle',timeout:120000});await scroll(m);await m.screenshot({path:'browser-preview/portfolio-mobile.png',fullPage:true,animations:'disabled'});await b.close();console.log(JSON.stringify(s))})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          node verify.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-preview
          path: browser-preview/
          retention-days: 7
