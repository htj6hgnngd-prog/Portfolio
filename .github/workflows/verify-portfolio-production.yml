name: Verify current portfolio production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'core.css'
      - 'script.js'
      - 'event-video.js'
      - 'photo-gallery.js'
      - 'photo.css'
      - 'product-experience.js'
      - 'product-experience.css'
      - 'site-experience.js'
      - 'site-experience.css'
      - '.github/workflows/verify-portfolio-production.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Verify current desktop and mobile render
        shell: bash
        run: |
          cat > verify-current.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const url = 'https://portfolio-main-production-fdd5.up.railway.app/';

          async function check(viewport, name) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport });
            await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForSelector('#photo.photo-section', { timeout: 30000 });
            await page.waitForSelector('#product.product-web-demo .dai-browser', { timeout: 30000 });
            await page.waitForSelector('#site.site-client-demo .site-browser', { timeout: 30000 });

            const state = await page.evaluate(() => ({
              width: innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              sections: ['youtube','video','ai','photo','product','site'].map(id => Boolean(document.getElementById(id))),
              pendingText: document.body.innerText.includes('МАТЕРИАЛЫ ПОЗЖЕ'),
              legacyNodes: document.querySelectorAll('.product-demo-section,.site-case-section,.site-portfolio-page,.site-home-page').length,
              product: Boolean(document.querySelector('#product.product-web-demo .dai-browser')),
              site: Boolean(document.querySelector('#site.site-client-demo .site-browser'))
            }));

            assert.ok(state.scrollWidth <= state.width + 2, name + ': horizontal overflow');
            assert.ok(state.sections.every(Boolean), name + ': missing portfolio section');
            assert.equal(state.pendingText, false, name + ': pending placeholder visible');
            assert.equal(state.legacyNodes, 0, name + ': legacy DOM remains');
            assert.equal(state.product, true, name + ': product experience missing');
            assert.equal(state.site, true, name + ': site experience missing');

            await page.screenshot({ path: 'portfolio-' + name + '.png', fullPage: true });
            console.log(name + ' PASS', JSON.stringify(state));
            await browser.close();
          }

          (async () => {
            await check({ width: 1440, height: 1000 }, 'desktop');
            await check({ width: 390, height: 844 }, 'mobile');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node verify-current.cjs
      - name: Upload current render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-production-render
          path: portfolio-*.png
          retention-days: 2
