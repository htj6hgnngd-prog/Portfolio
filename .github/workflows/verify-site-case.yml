name: Verify production site case

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-site-case.yml'

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify exact Denisov Photo production preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify exact desktop capture and autoplay
        shell: bash
        run: |
          cat > verify-site-case.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const url = 'https://portfolio-main-production-fdd5.up.railway.app/';

          async function verify(viewport, name) {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport });
            await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForFunction(() => document.querySelector('#site.site-case-section .site-case-capture'), null, { timeout: 30000 });
            await page.evaluate(() => document.querySelector('#site').scrollIntoView({ block: 'center' }));
            await page.waitForTimeout(1200);
            await page.waitForFunction(() => {
              const img = document.querySelector('.site-case-capture');
              return img && img.complete && img.naturalWidth > 0;
            }, null, { timeout: 30000 });

            const basics = await page.evaluate(() => {
              const site = document.querySelector('#site');
              const img = site.querySelector('.site-case-capture');
              return {
                title: site.querySelector('.site-case-title')?.textContent?.trim(),
                pending: site.textContent.includes('МАТЕРИАЛЫ ПОЗЖЕ'),
                imgSrc: img?.getAttribute('src'),
                naturalWidth: img?.naturalWidth,
                naturalHeight: img?.naturalHeight,
                phoneMocks: site.querySelectorAll('.site-case-phone').length,
                fakeDemoBlocks: site.querySelectorAll('.site-demo-page,.site-demo-hero,.site-demo-packages').length,
                liveHref: site.querySelector('.site-case-live')?.href,
                scrollWidth: document.documentElement.scrollWidth,
                viewportWidth: window.innerWidth,
                screenWidth: site.querySelector('.site-case-screen')?.getBoundingClientRect().width,
                imageWidth: img?.getBoundingClientRect().width,
                transform: getComputedStyle(img).transform
              };
            });

            assert.equal(basics.title, 'DENISOV PHOTO', `${name}: wrong case title`);
            assert.equal(basics.pending, false, `${name}: placeholder still visible`);
            assert.equal(basics.imgSrc, '/assets/site-case/denisovphoto-desktop.png?v=1', `${name}: wrong preview source`);
            assert.equal(basics.naturalWidth, 1440, `${name}: preview is not captured desktop width`);
            assert.equal(basics.naturalHeight, 4949, `${name}: preview height does not match captured real site`);
            assert.equal(basics.phoneMocks, 0, `${name}: mobile mock still exists`);
            assert.equal(basics.fakeDemoBlocks, 0, `${name}: recreated/fake site blocks still exist`);
            assert.ok(basics.liveHref.startsWith('https://denisovphoto.ru/'), `${name}: live link is wrong`);
            assert.ok(basics.scrollWidth <= basics.viewportWidth + 2, `${name}: horizontal page overflow ${basics.scrollWidth}/${basics.viewportWidth}`);
            assert.ok(Math.abs(basics.screenWidth - basics.imageWidth) <= 2, `${name}: captured site is not fitted 1:1 proportionally inside browser frame`);

            const transformBefore = await page.locator('.site-case-capture').evaluate(el => getComputedStyle(el).transform);
            await page.waitForTimeout(6200);
            const stateAfter = await page.locator('.site-case-capture').evaluate(el => ({ transform: getComputedStyle(el).transform, rectTop: el.getBoundingClientRect().top }));
            assert.notEqual(stateAfter.transform, transformBefore, `${name}: autoplay did not move the real-site capture`);

            console.log(`${name}: PASS`);
            console.log(JSON.stringify({ ...basics, transformBefore, transformAfter: stateAfter.transform }));
            await browser.close();
          }

          (async () => {
            await verify({ width: 1440, height: 1100 }, 'desktop');
            await verify({ width: 390, height: 844 }, 'mobile viewport / desktop case preserved');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node verify-site-case.cjs
