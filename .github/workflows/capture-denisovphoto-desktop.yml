name: Capture real Denisov Photo desktop site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-denisovphoto-desktop.yml'

permissions:
  contents: write

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture real Denisov Photo desktop site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture exact desktop render
        shell: bash
        run: |
          cat > capture-denisovphoto.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            await page.goto('https://denisovphoto.ru/', { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });

            const pageHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < pageHeight; y += 700) {
              await page.evaluate((value) => window.scrollTo(0, value), y);
              await page.waitForTimeout(180);
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(1000);
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });

            fs.mkdirSync(path.join(process.cwd(), 'assets/site-case'), { recursive: true });
            const out = path.join(process.cwd(), 'assets/site-case/denisovphoto-desktop.png');
            await page.screenshot({ path: out, fullPage: true, animations: 'disabled' });

            const metrics = await page.evaluate(() => ({
              width: document.documentElement.clientWidth,
              height: document.documentElement.scrollHeight,
              title: document.title,
              bodyBg: getComputedStyle(document.body).backgroundColor,
              bodyFont: getComputedStyle(document.body).fontFamily
            }));
            console.log('CAPTURE_METRICS', JSON.stringify(metrics));
            console.log('CAPTURE_BYTES', fs.statSync(out).size);
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node capture-denisovphoto.cjs
          test -s assets/site-case/denisovphoto-desktop.png

      - name: Commit captured desktop render
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-case/denisovphoto-desktop.png
          git commit -m 'Store exact Denisov Photo desktop render'
          git push origin HEAD:main
