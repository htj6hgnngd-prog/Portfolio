name: Import portfolio photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-portfolio-photos.yml'

permissions:
  contents: write

jobs:
  import-photos:
    if: github.event.head_commit.message == 'Import portfolio photos into repository'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download portfolio photos into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photos
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/2e2ec536-eb8f-4666-a1d1-ce859d002750.jpg' -o assets/photos/reportage-01.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/8be6c358-9737-497d-b206-4bd7fc74d3bd.jpg' -o assets/photos/reportage-02.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/d53b7bd6-43de-44b2-902c-c072ea815070.jpg' -o assets/photos/reportage-03.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/d33a9924-d73b-49c0-9a46-760d1e789ac3.jpg' -o assets/photos/reportage-04.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/3ba0cf23-af8d-4104-945c-ee86f063e971.jpg' -o assets/photos/reportage-05.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/fe27b99d-7fb2-432d-99be-1cbfb150847d.jpg' -o assets/photos/reportage-06.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/576a2689-0ce1-4069-a459-83ebd661fbe1.jpg' -o assets/photos/reportage-07.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/fb91add9-db96-429d-bfd5-a838e468eac1.jpg' -o assets/photos/reportage-08.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/0dedbb3b-52ab-47ec-a5fc-1d3e72634ad9.jpg' -o assets/photos/reportage-09.jpg
          curl -fL --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3DAx441iE4cBNKdBbYvFbic9eQg/eb3db2cc-ebbe-4ccc-a59f-c936db089bc1.jpg' -o assets/photos/reportage-10.jpg

          for f in assets/photos/*.jpg; do
            test "$(stat -c%s "$f")" -gt 20000
            test "$(xxd -p -l 2 "$f")" = 'ffd8'
          done

      - name: Commit photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos
          git commit -m 'Store reportage portfolio photos locally'
          git push origin HEAD:main
